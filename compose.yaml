name: glazr

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - glazr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [glazr_internal]

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GLAZR_BOOTSTRAP_ADMIN_EMAIL: ${GLAZR_BOOTSTRAP_ADMIN_EMAIL:-}
      GLAZR_BOOTSTRAP_ADMIN_PASSWORD: ${GLAZR_BOOTSTRAP_ADMIN_PASSWORD:-}
      GLAZR_BOOTSTRAP_ADMIN_NAME: ${GLAZR_BOOTSTRAP_ADMIN_NAME:-}
      GLAZR_ALLOWED_ORIGINS: ${GLAZR_ALLOWED_ORIGINS:-}
      GLAZR_SESSION_TIMEOUT: ${GLAZR_SESSION_TIMEOUT:-8h}
      GLAZR_COOKIE_SECURE: ${GLAZR_COOKIE_SECURE:-false}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: on-failure:3
    networks: [glazr_internal]

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "${GLAZR_HTTP_PORT:-8080}:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    networks: [glazr_internal]

networks:
  glazr_internal:
    driver: bridge

volumes:
  glazr_postgres_data:
