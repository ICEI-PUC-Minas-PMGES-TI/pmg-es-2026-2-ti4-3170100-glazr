events {
    worker_connections 1024;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 2m;

    # The socket address is authoritative; client-supplied forwarding headers
    # must not create new quotas. Empty keys exclude non-POST requests.
    map $request_method $login_rate_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $login_rate_key zone=login_per_ip:10m rate=5r/m;

    upstream glazr_backend {
        server backend:8080;
        keepalive 16;
    }

    server {
        listen 8080;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location = /api/v1/auth/login {
            limit_req zone=login_per_ip burst=4 nodelay;
            limit_req_status 429;
            error_page 429 = @login_rate_limited;
            proxy_pass http://glazr_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location @login_rate_limited {
            default_type application/problem+json;
            add_header Retry-After 12 always;
            add_header Cache-Control no-store always;
            return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"code":"LOGIN_RATE_LIMITED","detail":"Muitas tentativas de acesso. Aguarde 12 segundos e tente novamente.","instance":"/api/v1/auth/login"}';
        }

        location /api/ {
            proxy_pass http://glazr_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /oauth2/ {
            proxy_pass http://glazr_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location /login/oauth2/ {
            proxy_pass http://glazr_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store";
        }

        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
