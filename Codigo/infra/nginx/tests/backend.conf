events {}
http {
    server {
        listen 8080;
        default_type application/json;
        add_header X-Upstream-Reached true always;
        location /api/v1/auth/login {
            return 401 '{"code":"AUTHENTICATION_FAILED"}';
        }
        location / {
            return 200 '{"ok":true}';
        }
    }
}
