name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  login-proxy-tests:
    name: Proteção de login no Nginx
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Testar limite com HTTP real
        run: python3 -m unittest discover -s Codigo/infra/nginx/tests -v

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codigo/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        run: chmod +x mvnw && ./mvnw -B verify

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codigo/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Codigo/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test:run
      - name: Build frontend
        run: npm run build
